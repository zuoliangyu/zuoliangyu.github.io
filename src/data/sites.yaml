# 字段：
#   id        唯一标识（必填）
#   name      卡片标题（必填）
#   category  分类（必填）
#   url       主访问地址（必填）
#   summary   一句话说明（必填）
#   repo      owner/repo，构建时用于补全 star、最近更新、语言；留空则不补全
#   tags      标签列表
#   mirrors   备用地址，如 Netlify 镜像：[{ label, url }]
#   source    源码地址；默认取 https://github.com/<repo>

